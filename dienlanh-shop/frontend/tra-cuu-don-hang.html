<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu đơn hàng | D&T Điện Lạnh</title>
  <meta name="description" content="Tra cứu tình trạng đơn hàng bằng mã đơn và số điện thoại.">
  <meta property="og:title" content="Tra cứu đơn hàng | D&T Điện Lạnh">
  <meta property="og:description" content="Tra cứu tình trạng đơn hàng bằng mã đơn và số điện thoại.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0b5ed7">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="tracking">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-banner"><div class="container"><h1>Tra cứu đơn hàng</h1><p>Nhập mã đơn hàng và số điện thoại đặt hàng để theo dõi tình trạng giao hàng, lắp đặt.</p></div></section>
    <div class="container" style="max-width:820px">
      <form id="track-form" class="section section-box" novalidate>
        <div class="form-row">
          <div class="field"><label>Mã đơn hàng <span class="req">*</span></label><input name="code" required placeholder="VD: DT12345678"><div class="err">Vui lòng nhập mã đơn hàng</div></div>
          <div class="field"><label>Số điện thoại <span class="req">*</span></label><input name="phone" type="tel" required data-validate="phone" placeholder="Số điện thoại đặt hàng"><div class="err">Số điện thoại không hợp lệ</div></div>
        </div>
        <button class="btn btn-primary btn-lg">Tra cứu</button>
      </form>
      <div id="track-result"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/data/catalog.js"></script>
  <script src="assets/js/data/content.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/components/icons.js"></script>
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/components/art.js"></script>
  <script src="assets/js/components/ui.js"></script>
  <script src="assets/js/components/layout.js"></script>
  <script src="assets/js/pages/order.js"></script>
</body>
</html>
