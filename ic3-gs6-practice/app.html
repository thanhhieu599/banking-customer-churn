<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IC3 GS6 Spark Level 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: exam-software shell — dark title bar, white toolbar, paper question sheet on a cool grey desk, progress strip at the bottom. */
:root{
  --bg:#e9eef1; --paper:#ffffff; --ink:#1b2a33; --muted:#5a6a74; --line:#d4dde2; --line-strong:#9fb0b9;
  --bar:#173c4f; --bar-fg:#f1f7fa; --bar-icon:#173c4f; --bar-line:rgba(255,255,255,.28); --bar-warn:#ffd27a;
  --accent:#0b7a8b; --accent-fg:#ffffff; --accent-soft:#d6eef1;
  --chip:#dde4e8; --chip-hover:#cdd7dc; --sel:#173c4f; --sel-fg:#ffffff;
  --target:#173c4f; --target-fg:#f1f7fa;
  --mute-btn:#68777f; --mute-btn-fg:#ffffff;
  --ok:#1d7f46; --ok-soft:#dbf1e3; --bad:#bf3329; --bad-soft:#f8dfdc; --warn:#b06f12; --warn-soft:#fbedd3;
  --scrim:rgba(14,28,37,.48);
  --hw-body:#e3e8eb; --hw-edge:#b6c1c7; --hw-metal:#9aa5ad; --hw-port:#22292e; --hw-gold:#c9a24a; --hw-blue:#2f7fd8; --hw-ink:#28343b; --hw-field:#f7f9fa; --hw-btn-fg:#ffffff;
  --f-display:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --qs:1;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shared bar ---------- */
.titlebar{background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:13px;flex-wrap:wrap}
.titlebar .brand{font-weight:700;letter-spacing:.02em}
.titlebar .mode{opacity:.75}
.titlebar .tb-time{margin-left:auto;font:700 15px var(--f-mono);font-variant-numeric:tabular-nums}
.titlebar .tb-time.low{color:var(--bar-warn)}
.tb-btn{background:transparent;border:1px solid var(--bar-line);color:var(--bar-fg);border-radius:3px;padding:4px 10px;cursor:pointer;font-size:13px}
.tb-btn:hover{background:var(--bar-line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bar);color:var(--bar-fg);border:0;border-radius:3px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:36px;text-decoration:none}
.btn:hover{filter:brightness(1.18)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn-mute{background:var(--mute-btn);color:var(--mute-btn-fg)}
.btn-end{background:var(--accent);color:var(--accent-fg)}
.btn-line{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn-line:hover{background:var(--chip);filter:none}
.btn-danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn .ico{width:18px;height:18px}

/* ---------- exam ---------- */
.exam{display:flex;flex-direction:column;height:100%}
.toolbar{background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 16px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pos{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos b{color:var(--ink)}
.ib{width:40px;height:36px;display:inline-grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--bar-icon);border-radius:3px;cursor:pointer;font:800 17px var(--f-body);letter-spacing:-.02em}
.ib:hover{background:var(--chip)}
.ib:disabled{opacity:.3;cursor:not-allowed;background:transparent}
.ib .ico{width:25px;height:25px}
.ib.on{background:var(--accent-soft);border-color:var(--accent)}
.mark{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;margin-right:6px}
.mark input{width:18px;height:18px;accent-color:var(--warn);margin:0}
.exam.review [data-live]{display:none!important}
.exam:not(.review) [data-review]{display:none!important}

.stage{flex:1;overflow:auto;padding-block:20px 28px;padding-inline:16px}
.sheet{max-width:1180px;margin-inline:auto;background:var(--paper);border:1px solid var(--line)}
.stem{padding:20px 24px 16px;border-bottom:1px solid var(--line);font-size:calc(15px * var(--qs))}
.dom{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:6px}
.instr{margin:10px 0 0;color:var(--muted);font-size:.92em}
.figure{max-width:720px;margin-top:14px}
.figure svg,.hsbox svg{display:block;width:100%;height:auto}
.grip{text-align:center;color:var(--muted);letter-spacing:.35em;font-size:10px;padding-top:6px;user-select:none}
.answers{padding:18px 24px 26px;font-size:calc(15px * var(--qs))}
.locked .opt,.locked .chip,.locked .hs,.locked td[data-r]{cursor:default}

.opts{display:flex;flex-direction:column;gap:10px;max-width:820px;margin-inline:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--chip);border:2px solid transparent;padding:12px 16px;cursor:pointer;border-radius:2px;color:var(--ink)}
.opt:hover{background:var(--chip-hover)}
.opt .mk{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:50%}
.opts.multi .mk{border-radius:3px}
.opt.picked{background:var(--sel);color:var(--sel-fg)}
.opt.picked .mk{border-color:var(--sel-fg);background:var(--sel-fg);box-shadow:inset 0 0 0 3px var(--sel)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.right.missed{border-style:dashed}
.opt.right.picked .mk{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 3px var(--ok-soft)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt.wrong .mk{border-color:var(--bad);background:var(--bad);box-shadow:inset 0 0 0 3px var(--bad-soft)}
.tag{margin-left:auto;flex:none;font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.tag.bad{color:var(--bad)}

.yn-wrap{overflow-x:auto}
.yn{width:100%;border-collapse:collapse;min-width:420px}
.yn th{background:var(--bar);color:var(--bar-fg);font-weight:600;padding:9px 10px;width:96px;border:1px solid var(--bar)}
.yn th:first-child{background:transparent;border:0;width:auto}
.yn td{border:1px solid var(--line-strong);padding:14px 16px}
.yn td[data-r]{text-align:center;cursor:pointer}
.yn td[data-r]:hover{background:var(--chip)}
.yn input{width:20px;height:20px;accent-color:var(--accent);margin:0;pointer-events:none}
.yn tr.right td.st{background:var(--ok-soft)}
.yn tr.wrong td.st{background:var(--bad-soft)}
.yn td.key{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.yn .verdict{display:block;font-size:.75em;font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.yn tr.right .verdict{color:var(--ok)} .yn tr.wrong .verdict{color:var(--bad)}

.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px 28px;align-items:start}
.pool{display:flex;flex-direction:column;gap:10px;min-height:56px;padding:6px;border:1px dashed transparent;border-radius:3px}
.pool.over{border-color:var(--accent);background:var(--accent-soft)}
.pool-empty{color:var(--muted);font-size:.9em;text-align:center;padding:12px}
.pairs{display:flex;flex-direction:column;gap:20px;min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.slot{min-height:48px;border:1px solid var(--line-strong);background:var(--paper);border-radius:2px;display:flex;flex-direction:column;justify-content:center;padding:4px;cursor:pointer}
.slot.armed{border-style:dashed;border-color:var(--accent)}
.slot.over{border-color:var(--accent);background:var(--accent-soft)}
.slot.ok{border:2px solid var(--ok);background:var(--ok-soft)}
.slot.bad{border:2px solid var(--bad);background:var(--bad-soft)}
.target{background:var(--target);color:var(--target-fg);padding:12px 16px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:2px;min-height:48px}
.chip{position:relative;display:block;width:100%;background:var(--chip);border:2px solid transparent;padding:11px 36px;text-align:center;cursor:grab;border-radius:2px;color:var(--ink);touch-action:manipulation}
.chip:hover{background:var(--chip-hover)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.dragging{opacity:.45}
.chip .mv{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.slot .chip{background:var(--chip)}
.slot.ok .chip,.slot.bad .chip{background:transparent}
.should{font-size:.85em;color:var(--bad);padding:2px 8px 4px;text-align:center}
.should b{color:var(--ink)}

.hsbox{max-width:760px;margin-inline:auto;border:1px solid var(--line)}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:transparent;stroke:transparent;stroke-width:2}
.hs:hover .hit,.hs:focus-visible .hit{fill:var(--accent-soft);stroke:var(--accent)}
.hs.picked .hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.hs.right .hit{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}
.hs.wrongpick .hit{fill:var(--bad-soft);stroke:var(--bad);stroke-width:3}
.hw-body{fill:var(--hw-body);stroke:var(--hw-edge);stroke-width:1.5}
.hw-plain{fill:var(--hw-body)}
.hw-metal{fill:var(--hw-metal)} .hw-port{fill:var(--hw-port)} .hw-gold{fill:var(--hw-gold)} .hw-blue{fill:var(--hw-blue)} .hw-field{fill:var(--hw-field)}
.hw-fill{fill:var(--hw-ink)}
.hw-ico{fill:none;stroke:var(--hw-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hw-text{fill:var(--hw-ink);font-family:var(--f-body);font-size:13px}
.hw-ibtn{fill:var(--hw-body);stroke:var(--hw-edge)}
.hw-btn-text{fill:var(--hw-btn-fg);font-family:var(--f-body);font-weight:600;font-size:14px;text-anchor:middle}
.hw-big{fill:var(--hw-ink);font-family:var(--f-body);font-size:19px;text-anchor:middle}
.hw-label{fill:var(--bad);font-family:var(--f-body);font-weight:700;font-size:22px;text-anchor:middle}

.note{max-width:820px;margin:0 auto 18px;padding:10px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);font-size:14px}
.fbwrap{padding:0 24px 24px}
.fb-box{max-width:820px;margin-inline:auto;border:1px solid var(--line);background:var(--bg);padding:16px 18px;font-size:calc(14.5px * var(--qs))}
.fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}
.fb-key{margin:0 0 8px}
.fb-exp{margin:0;color:var(--ink)}
.fb-check{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

.foot{background:var(--paper);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.segs{display:flex;gap:3px}
.seg{flex:1;height:10px;min-width:0;border:0;padding:0;background:var(--line);cursor:pointer;border-radius:1px;position:relative}
.seg.ans{background:var(--accent)}
.seg.mk{background:var(--warn)}
.seg.ok{background:var(--ok)} .seg.bad{background:var(--bad)}
.seg.cur{outline:2px solid var(--ink);outline-offset:1px}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* ---------- home & result ---------- */
.page{max-width:1080px;margin-inline:auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:30px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 8px}
.hero h1{font-size:clamp(26px,4.2vw,42px);line-height:1.12;font-weight:800;letter-spacing:-.015em;max-width:22ch}
.lede{max-width:66ch;color:var(--muted);margin:12px 0 0;font-size:16px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:22px 0 0}
.facts div{background:var(--paper);padding:14px 16px}
.facts dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:4px 0 0;font:700 24px var(--f-mono);font-variant-numeric:tabular-nums}
.facts dd small{font:500 13px var(--f-body);color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--paper);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:21px}
.card p{margin:0;color:var(--muted)}
.card ul{margin:0;padding-left:18px;color:var(--muted)}
.card .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.resume{background:var(--warn-soft);border:1px solid var(--warn);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.resume b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;cursor:pointer;user-select:none}
.cb input{accent-color:var(--accent);margin:0}
.cb:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.row select{font:inherit;padding:6px 8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:3px}
.row label{display:inline-flex;gap:7px;align-items:center}
.row input[type=checkbox]{accent-color:var(--accent)}
.sec h2{font-size:20px;margin-bottom:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{margin:0}
.tbl-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 14px;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.num{text-align:right;font-family:var(--f-mono)}
.empty{padding:22px;color:var(--muted);text-align:center}
.small-btn{padding:4px 10px;min-height:30px;font-size:13px}

.score-head{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
.score{font:700 clamp(48px,9vw,76px)/1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--muted);font-weight:500}
.bars{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);padding:18px}
.bar-row{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 64px;gap:14px;align-items:center;font-size:14px}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok);border-radius:5px}
.fill.low{background:var(--bad)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.qcell{height:42px;border:1px solid var(--line-strong);background:var(--paper);font:600 14px var(--f-mono);cursor:pointer;position:relative;border-radius:2px;color:var(--ink)}
.qcell:hover{border-color:var(--accent)}
.qcell.ans{background:var(--accent-soft);border-color:var(--accent)}
.qcell.skip{border-style:dashed}
.qcell.mk::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--warn);border-radius:50%}
.qcell.cur{outline:2px solid var(--ink);outline-offset:1px}
.qcell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qcell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border:1px solid var(--line-strong);display:inline-block;background:var(--paper)}
.legend i.ans{background:var(--accent-soft);border-color:var(--accent)}
.legend i.mk{background:var(--warn);border-color:var(--warn);border-radius:50%;width:9px;height:9px}
.legend i.skip{border-style:dashed}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)} .legend i.bad{background:var(--bad-soft);border-color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line-strong);background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink)}
.tab.on{background:var(--bar);color:var(--bar-fg);border-color:var(--bar)}
.foot-note{color:var(--muted);font-size:13px;max-width:80ch}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--paper);color:var(--ink);max-width:700px;width:100%;max-height:min(88vh,760px);overflow:auto;padding:22px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal h2{font-size:20px;margin-bottom:12px}
.modal p{margin:0 0 10px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-fg);padding:10px 18px;border-radius:4px;z-index:60;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:760px){
  .modes{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .match{grid-template-columns:1fr}
  .pool{flex-direction:row;flex-wrap:wrap}
  .pool .chip{width:auto;flex:1 1 140px}
  .stem{padding:16px}
  .answers{padding:16px}
  .fbwrap{padding:0 16px 16px}
  .bar-row{grid-template-columns:1fr 54px}
  .bar-row .track{grid-column:1 / -1;grid-row:2}
}
@media (max-width:520px){
  .lbl{display:none}
  .toolbar{padding:8px 12px}
  .pair{grid-template-columns:1fr;gap:6px}
}
@media (prefers-reduced-motion: no-preference){
  .opt,.chip,.slot,.seg{transition:background-color .12s,border-color .12s}
}
</style>

<!-- ================= HOME ================= -->
<div id="home" class="view"></div>

<!-- ================= EXAM ================= -->
<section id="exam" class="exam" hidden>
  <div class="titlebar">
    <button class="tb-btn" id="bHome" type="button">← Trang chủ</button>
    <span class="brand">IC3 GS6 Spark · Level 2</span>
    <span class="mode" id="candName"></span>
    <span class="mode" id="modeLabel">Thi thử</span>
    <span class="tb-time" id="timer" aria-live="off">50:00</span>
  </div>
  <div class="toolbar">
    <div class="grp">
      <button class="btn" id="bPrev" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4v16M20 12H8m5-5-5 5 5 5"/></svg><span class="lbl">Trước</span></button>
      <button class="btn btn-mute" id="bReset" type="button" data-live><svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span class="lbl">Đặt lại</span></button>
      <span class="pos"><b id="qpos">1/45</b> <span id="qid"></span></span>

{d:4,t:'multi',q:'Bạn cần gửi video bài tập 300 MB, nhưng email chỉ cho đính kèm tối đa 25 MB. Hai cách nào phù hợp?',
 o:['Tải video lên Google Drive/OneDrive và gửi đường liên kết','Đổi đuôi tệp thành .txt','Dùng dịch vụ gửi tệp lớn hoặc nén, chia nhỏ tệp','Chụp màn hình video để gửi','Bấm Gửi nhiều lần cho đến khi được'],a:[0,2],
 e:'Tệp lớn nên chia sẻ bằng liên kết đám mây (có thể phân quyền) hoặc dịch vụ gửi tệp lớn.'},
{d:4,t:'single',q:'Chữ ký email (signature) thường có những thông tin gì?',
 o:['Họ tên, lớp/trường hoặc chức danh, cách liên hệ','Mật khẩu email','Toàn bộ các email cũ','Nhạc nền và ảnh động'],a:0,
 e:'Chữ ký email giúp người nhận biết bạn là ai. Không bao giờ ghi mật khẩu vào email.'},
{d:4,t:'single',q:'Khi viết email cho thầy cô, điều nào nên TRÁNH?',
 o:['Lời chào phù hợp','Dùng tiếng lóng, viết tắt và nhiều biểu tượng cảm xúc','Viết ngắn gọn, rõ ràng','Kiểm tra chính tả trước khi gửi'],a:1,
 e:'Email với thầy cô, người lớn cần lịch sự, rõ ràng. Tiếng lóng, viết tắt dễ gây hiểu lầm.'},
{d:4,t:'single',q:'Thầy chủ nhiệm đi công tác một tuần và muốn ai gửi email cũng nhận được thông báo thầy vắng mặt. Thầy dùng tính năng nào?',
 o:['Chuyển tiếp (Forward) mọi email','Trả lời tự động (Automatic Replies / Out of Office)','Đánh dấu tất cả là đã đọc','Xóa hộp thư'],a:1,
 e:'Out of Office tự động trả lời người gửi trong khoảng thời gian được đặt.'},
{d:4,t:'hotspot',svg:'mail',q:'Bạn muốn gửi kèm tệp bài tập trong email này. Nhấp vào nút phù hợp.',a:4,
 e:'Biểu tượng kẹp giấy (Attach / Đính kèm) dùng để thêm tệp vào email.'},
{d:4,t:'hotspot',svg:'mail',q:'Bạn gửi bài cho cô giáo bộ môn và muốn gửi bản sao để cô chủ nhiệm cùng biết. Nhấp vào ô phù hợp để thêm địa chỉ cô chủ nhiệm.',a:2,
 e:'Cc (bản sao): người nhận ở Cc được biết thông tin, người nhận chính nằm ở To. Mọi người đều thấy địa chỉ trong ô Cc.'},
{d:4,t:'single',q:'Trong lớp học trực tuyến, khi chưa đến lượt phát biểu, bạn nên làm gì?',
 o:['Bật micro để mọi người nghe tiếng ồn xung quanh','Tắt micro (Mute) và dùng nút giơ tay khi muốn phát biểu','Rời khỏi lớp','Nói chen vào lúc thầy cô đang giảng'],a:1,
 e:'Tắt micro giúp lớp không bị ồn. Dùng tính năng Raise hand (giơ tay) hoặc khung chat để xin phát biểu.'},
{d:4,t:'multi',q:'Hai việc nào là quy tắc lịch sự khi học trực tuyến qua video?',
 o:['Vào lớp đúng giờ, chuẩn bị chỗ ngồi gọn gàng','Dùng khung chat đúng mục đích, lịch sự','Chia sẻ đường link lớp học lên mạng xã hội','Ăn uống trước camera','Đổi tên hiển thị thành tên vui nhộn'],a:[0,1],
 e:'Đúng giờ, gọn gàng, chat lịch sự. Không chia sẻ link lớp công khai vì người lạ có thể vào phá.'},
{d:4,t:'single',q:'Nhóm chat của lớp có 40 bạn. Bạn muốn hỏi riêng một bạn về chuyện cá nhân. Bạn nên làm gì?',
 o:['Hỏi trong nhóm chat lớp','Nhắn tin riêng (tin nhắn trực tiếp) cho bạn đó','Đăng lên trang cá nhân','Gửi email cho cả lớp'],a:1,
 e:'Chuyện riêng nên nhắn riêng. Nhóm chung dành cho thông tin cả lớp cần biết.'},

/* ======================= 6. CỘNG TÁC (13) ======================= */
{d:5,t:'multi',q:'Nhóm bạn cùng làm bài báo cáo trên Google Docs hoặc Word Online. Ba lợi ích của việc cùng soạn thảo trực tuyến là gì?',
 o:['Nhiều bạn cùng sửa một tệp cùng lúc','Không cần Internet','Xem và khôi phục bản cũ nhờ lịch sử phiên bản','Viết bình luận, gắn tên @bạn để giao việc','Mỗi người làm một bản rồi tự ghép lại'],a:[0,2,3],
 e:'Cùng soạn thảo trực tuyến giúp không phải gửi qua lại nhiều bản. Cần Internet để đồng bộ.'},
{d:5,t:'single',q:'Bạn chia sẻ tài liệu và chỉ muốn bạn bè góp ý bằng bình luận, không sửa nội dung. Bạn chọn quyền nào?',
 o:['Người xem (Viewer)','Người nhận xét (Commenter)','Người chỉnh sửa (Editor)','Chủ sở hữu (Owner)'],a:1,
 e:'Commenter được bình luận, góp ý nhưng không sửa trực tiếp.'},
{d:5,t:'yesno',q:'Với mỗi phát biểu về lịch sử phiên bản (version history), hãy chọn Yes nếu đúng hoặc No nếu sai.',

 e:'Khôi phục bản cũ thường tạo ra một bản mới, các bản khác vẫn còn. Lịch sử phiên bản là tính năng của Google Drive, OneDrive.'},
{d:5,t:'single',q:'Nhóm bạn cần hẹn giờ học nhóm online tuần này. Cách nào tiện nhất?',
 o:['Mỗi người tự nhớ giờ','Tạo sự kiện trên lịch chung (Google Calendar / Outlook) và gửi lời mời kèm link họp cho cả nhóm','Hẹn miệng ở trường','Đăng giờ học lên mạng xã hội công khai'],a:1,
 e:'Lời mời trên lịch tự nhắc mọi người, có link họp và cho biết ai đồng ý tham gia.'},
{d:5,t:'match',q:'Ghép mỗi quyền chia sẻ với việc người đó được làm.',
 items:['Chủ sở hữu (Owner)','Người chỉnh sửa (Editor)','Người nhận xét (Commenter)','Người xem (Viewer)'],

 e:'Chỉ cấp quyền vừa đủ cho việc cần làm.'},
{d:5,t:'single',q:'Bạn chia sẻ thư mục ảnh của lớp có ảnh các bạn. Cách chia sẻ nào an toàn nhất?',
 o:['Ai có link cũng được chỉnh sửa','Đăng công khai lên mạng','Chỉ chia sẻ cho email của các bạn trong lớp, quyền Xem','Gửi mật khẩu tài khoản của bạn cho cả lớp'],a:2,
 e:'Chia sẻ cho đúng người, quyền thấp nhất cần thiết. Link "ai cũng xem được" có thể bị chuyển ra ngoài.'},
{d:5,t:'single',q:'Nhóm bạn cần theo dõi: ai làm phần nào, hạn nộp, đã xong chưa. Công cụ nào phù hợp?',
 o:['Ứng dụng quản lý công việc như Microsoft Planner, Trello','Máy tính bỏ túi','Trình phát nhạc','Ứng dụng chỉnh ảnh'],a:0,
 e:'Planner/Trello có các thẻ công việc với người phụ trách, hạn chót và trạng thái (Cần làm – Đang làm – Đã xong).'},
{d:5,t:'single',q:'Trong Google Docs, bạn muốn nhắc bạn Lan sửa một đoạn văn. Cách nhanh nhất là gì?',
 o:['Viết chữ in hoa vào giữa bài','Thêm bình luận và gõ @Lan để Lan nhận thông báo','Xóa đoạn văn đó','Gọi điện cho cả nhóm'],a:1,

{d:5,t:'single',q:'Một bạn trong nhóm lỡ xóa mất phần bài của bạn khác trên tài liệu chung. Làm sao lấy lại?',
 o:['Viết lại từ đầu','Mở Lịch sử phiên bản và khôi phục bản trước khi bị xóa','Tạo tài liệu mới','Không thể lấy lại'],a:1,
 e:'Google Docs: File > Version history. Word Online: File > Info > Version History.'},
{d:5,t:'yesno',q:'Với mỗi phát biểu về làm việc nhóm online, hãy chọn Yes nếu đúng hoặc No nếu sai.',
 rows:['Nên chia việc rõ ràng cho từng thành viên.','Nên đặt hạn chót cho từng phần việc.','Một bạn nên làm hết để nhanh hơn.','Nên tôn trọng ý kiến của các bạn khi góp ý.'],a:[1,1,0,1],
 e:'Làm việc nhóm hiệu quả: phân công rõ, có hạn chót, góp ý tôn trọng, mọi người cùng tham gia.'},
{d:5,t:'match',order:true,q:'Sắp xếp các bước làm một dự án nhóm trực tuyến theo đúng thứ tự.',

{d:5,t:'single',q:'Trong buổi họp nhóm trên Teams hoặc Google Meet, bạn muốn cả nhóm cùng xem slide trên máy của bạn. Bạn dùng tính năng nào?',
 o:['Tắt camera','Chia sẻ màn hình (Share screen / Present)','Rời cuộc họp','Đổi hình nền'],a:1,
 e:'Chia sẻ màn hình giúp mọi người thấy đúng nội dung bạn đang trình bày.'},
{d:5,t:'hotspot',svg:'word',q:'Bạn muốn mời bạn cùng nhóm vào chỉnh sửa tài liệu này. Nhấp vào nút phù hợp.',a:9,
 e:'Nút Chia sẻ (Share) ở góc phải cho phép nhập email người nhận và chọn quyền: chỉnh sửa, nhận xét hoặc chỉ xem.'},

/* ======================= 7. AN TOÀN & BẢO MẬT (16) ======================= */
{d:6,t:'multi',q:'Bạn vừa đăng ký một tài khoản Google. Tài khoản mới của bạn dùng Đăng nhập một lần (SSO).\nBa lợi ích của Đăng nhập một lần (SSO) là gì?',
 o:['Bạn chỉ cần nhớ một bộ thông tin đăng nhập','SSO thuộc sở hữu và do chính phủ điều hành','Đăng nhập một lần là dùng được email, lưu trữ tài liệu, ứng dụng và trang web liên kết','Tài khoản SSO không bao giờ bị tấn công','Ít mật khẩu hơn nên dễ bảo vệ tài khoản chính bằng mật khẩu mạnh và xác thực 2 bước'],a:[0,2,4],
 e:'SSO tiện lợi, nhưng nếu lộ tài khoản chính thì mọi dịch vụ liên kết đều bị ảnh hưởng, nên phải bật xác thực 2 bước.'},
{d:6,t:'single',q:'Mật khẩu nào mạnh nhất?',

 e:'Mật khẩu mạnh: dài từ 12 ký tự, có chữ hoa, chữ thường, số và ký hiệu, không chứa tên hoặc ngày sinh.'},
{d:6,t:'match',q:'Ghép mỗi mối nguy trên mạng với mô tả phù hợp.',
 items:['Lừa đảo (Phishing)','Mã độc tống tiền (Ransomware)','Trojan','Phần mềm gián điệp (Spyware)','Tường lửa (Firewall)'],
 targets:['Tin nhắn giả mạo dụ bạn nhập mật khẩu','Khóa toàn bộ tệp và đòi tiền chuộc','Trò chơi "miễn phí" nhưng giấu mã độc bên trong','Lén theo dõi những gì bạn làm trên máy'],a:[0,1,2,3],
 e:'Tường lửa là công cụ bảo vệ, không phải mối nguy.'},
{d:6,t:'single',q:'Ví dụ nào là xác thực hai yếu tố (2FA)?',
 o:['Nhập mật khẩu hai lần','Nhập mật khẩu, sau đó nhập mã gửi về điện thoại','Trả lời hai câu hỏi bí mật','Có hai mật khẩu cho hai tài khoản'],a:1,
 e:'2FA kết hợp hai loại khác nhau: thứ bạn biết (mật khẩu) + thứ bạn có (điện thoại) hoặc thứ thuộc về bạn (vân tay).'},
{d:6,t:'yesno',q:'Với mỗi phát biểu về Wi-Fi công cộng (quán cà phê, trung tâm thương mại), hãy chọn Yes nếu đúng hoặc No nếu sai.',
 rows:['Không nên đăng nhập tài khoản quan trọng khi dùng Wi-Fi công cộng không mật khẩu.','VPN giúp mã hóa kết nối khi dùng Wi-Fi công cộng.','Wi-Fi có tên giống tên quán chắc chắn là của quán.','Nên tắt tự động kết nối với Wi-Fi lạ.'],a:[1,1,0,1],
 e:'Kẻ xấu có thể phát Wi-Fi giả trùng tên. Hãy hỏi nhân viên đúng tên mạng.'},
{d:6,t:'hotspot',svg:'browser',q:'Bạn muốn kiểm tra trang web có kết nối bảo mật hay không. Nhấp vào vị trí phù hợp trên trình duyệt.',a:3,
 e:'Biểu tượng ổ khóa ở đầu thanh địa chỉ cho biết kết nối có được mã hóa không và hiển thị thông tin chứng chỉ của trang.'},
{d:6,t:'single',q:'Dấu hiệu nào cho thấy email có thể là lừa đảo?',
 o:['Email của thầy cô gửi đúng lịch học đã báo','Địa chỉ người gửi lạ, viết sai tên, giục bạn "đăng nhập trong 24 giờ kẻo mất tài khoản" qua đường link','Email có chữ ký và số điện thoại trường','Thông báo lịch họp từ lịch của lớp'],a:1,
 e:'Lừa đảo thường: người gửi lạ hoặc giả tên, tạo cảm giác gấp gáp, đòi mật khẩu/mã OTP, có đường link lạ.'},
{d:6,t:'single',q:'Quy tắc sao lưu 3-2-1 nghĩa là gì?',
 o:['3 mật khẩu, 2 tài khoản, 1 máy','3 bản sao dữ liệu, trên 2 loại thiết bị lưu trữ, 1 bản để ở nơi khác (như đám mây)','Sao lưu 3 lần mỗi ngày','3 ổ cứng trong 1 máy'],a:1,
 e:'Quy tắc 3-2-1 giúp không mất dữ liệu khi hỏng máy, mất máy hay bị mã độc.'},
{d:6,t:'multi',q:'Hai cách nào giúp bảo vệ dữ liệu nếu bạn làm mất điện thoại?',
 o:['Đặt khóa màn hình bằng mã PIN, vân tay hoặc khuôn mặt','Bật tính năng Tìm thiết bị (Find My Device / Find My iPhone)','Ghi mật khẩu dán sau ốp lưng','Tắt mọi bản cập nhật','Để điện thoại không khóa cho tiện'],a:[0,1],
 e:'Khóa màn hình chặn người lạ; Tìm thiết bị giúp định vị, khóa và xóa dữ liệu từ xa.'},
{d:6,t:'single',q:'Chữ "S" trong HTTPS nghĩa là gì?',
 o:['Speed: nhanh hơn','Secure: dữ liệu được mã hóa khi truyền đi','Server: máy chủ riêng','Search: đã được Google kiểm tra'],a:1,
 e:'HTTPS mã hóa đường truyền, nhưng không đảm bảo trang đó đáng tin. Trang lừa đảo cũng có thể dùng HTTPS.'},
{d:6,t:'yesno',q:'Với mỗi phát biểu về quyền của ứng dụng, hãy chọn Yes nếu đúng hoặc No nếu sai.',
 rows:['Ứng dụng đèn pin đòi xem danh bạ là đáng ngờ.','Nên xem lại các quyền khi cài ứng dụng mới.','Có phần mềm diệt virus là an toàn tuyệt đối, không cần cập nhật.','Nên tải ứng dụng từ Google Play hoặc App Store.'],a:[1,1,0,1],
 e:'Chỉ cấp quyền mà ứng dụng thật sự cần. Phần mềm diệt virus phải được cập nhật thường xuyên.'},
{d:6,t:'single',q:'Bạn nhận tin nhắn: "Chúc mừng bạn trúng thưởng điện thoại! Bấm link và nhập số thẻ ngân hàng của bố mẹ để nhận quà". Bạn nên làm gì?',
 o:['Nhập ngay kẻo hết hạn','Gửi cho bạn bè cùng nhận','Không bấm link, báo bố mẹ và xóa tin nhắn','Nhắn lại hỏi thêm'],a:2,
 e:'Đây là lừa đảo. Không bấm link, không cung cấp thông tin thẻ hay mã OTP; báo người lớn.'},
{d:6,t:'single',q:'Một người lạ quen trên game online xin địa chỉ nhà và ảnh của bạn. Bạn nên làm gì?',

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=sec=>{sec=Math.max(0,sec|0);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0')};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const K={sess:'ic3spark.l2.session',hist:'ic3spark.l2.history',wrong:'ic3spark.l2.wrong',font:'ic3spark.l2.font',name:'ic3spark.l2.name'};
const TEST_N=45, TEST_MIN=50, PASS=700, SCALES=[1,1.15,1.3];
const MOVE='<svg class="ico mv" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>';

let S=null, timerId=null, selItem=null, fontIdx=store.get(K.font,0)||0;

function blank(q){return q.t==='multi'?[]:q.t==='yesno'?q.rows.map(()=>null):q.t==='match'?q.targets.map(()=>null):null}
function answered(q,a){if(a==null)return false;if(q.t==='multi')return a.length>0;if(q.t==='yesno'||q.t==='match')return a.some(v=>v!=null);return true}
function isCorrect(q,a){
 if(a==null)return false;
 if(q.t==='single'||q.t==='hotspot')return a===q.a;
 if(q.t==='multi')return a.length===q.a.length&&q.a.every(v=>a.includes(v));
 return q.a.every((v,k)=>a[k]===v);
}
function instr(q){
 return {single:'Chọn một đáp án.',multi:`Chọn ${q.a.length} đáp án.`,yesno:'Với mỗi phát biểu, chọn Yes nếu đúng hoặc No nếu sai.',
  hotspot:'Nhấp vào vị trí đúng trên hình.',
  match:q.order?'Kéo các mục ở cột trái thả vào ô trống theo đúng thứ tự. Trên điện thoại: chạm vào mục, rồi chạm vào ô.':'Kéo từng mục ở cột trái thả vào ô trống cạnh mô tả phù hợp. Có thể có mục không dùng đến. Trên điện thoại: chạm vào mục, rồi chạm vào ô.'}[q.t];
}
const curId=()=>S.ids[S.cur];
const locked=()=>S.done||(S.mode==='train'&&!!S.chk[curId()]);
function save(){if(S&&!S.done)store.set(K.sess,S)}
function show(v){['home','exam','result'].forEach(x=>{$('#'+x).hidden=x!==v});window.scrollTo(0,0)}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
let noteT;function note(msg){const n=$('#note');n.textContent=msg;n.hidden=false;clearTimeout(noteT);noteT=setTimeout(()=>n.hidden=true,3500)}
function armConfirm(btn,fn){if(btn.dataset.armed){fn();return}const old=btn.textContent;btn.dataset.armed='1';btn.textContent='Bấm lần nữa để xác nhận';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3500)}
function applyFont(){$('#exam').style.setProperty('--qs',SCALES[fontIdx]);$('#bFont').classList.toggle('on',fontIdx>0)}

/* ===================== PHIÊN LÀM BÀI ===================== */
function pickTest(n){
 const pools=DOMAINS.map((_,d)=>shuffle(BANK.filter(q=>q.d===d).map(q=>q.id)));
 const out=[];let d=0;
 while(out.length<n&&pools.some(p=>p.length)){if(pools[d].length)out.push(pools[d].pop());d=(d+1)%pools.length}
 return shuffle(out);
}
function newSession(mode,ids,title){
 if(!ids.length){toast('Không có câu hỏi phù hợp với lựa chọn của bạn.');return}
 const orders={},ans={};
 ids.forEach(id=>{const q=QM[id];ans[id]=blank(q);if(q.t==='match')orders[id]=shuffle(q.items.map((_,i)=>i))});
 S={mode,title,name:store.get(K.name,''),ids,cur:0,ans,orders,mark:{},skip:{},chk:{},elapsed:0,limit:mode==='test'?TEST_MIN*60:null,done:false,created:Date.now()};
 selItem=null;save();openExam();
}
function openExam(){show('exam');applyFont();if(!S.done)startTimer();else tick();renderQ()}
function startTimer(){
 stopTimer();tick();
 timerId=setInterval(()=>{
  S.elapsed++;tick();if(S.elapsed%5===0)save();
  if(S.limit&&S.elapsed>=S.limit){closeModal();finish();toast('Hết giờ. Bài làm đã được nộp tự động.')}
 },1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function tick(){
 const t=$('#timer');$('#candName').textContent=S.name?'Thí sinh: '+S.name:'';
 $('#modeLabel').textContent=S.done?'Xem lại bài làm':(S.mode==='test'?'Thi thử · Testing mode':'Luyện tập · Training mode')+(S.title?' · '+S.title:'');
 if(S.done){t.textContent='Đúng '+S.grade.c+'/'+S.grade.n;t.classList.remove('low');return}
 if(S.limit){const r=S.limit-S.elapsed;t.textContent='Còn lại '+fmt(r);t.classList.toggle('low',r<=300)}
 else{t.textContent='Thời gian '+fmt(S.elapsed);t.classList.remove('low')}
}

/* ===================== HIỂN THỊ CÂU HỎI ===================== */
function renderQ(){
 const id=curId(),q=QM[id],a=S.ans[id],tr=S.mode==='train',rev=S.done;
 const sol=rev||(tr&&!!S.chk[id]);
 $('#exam').classList.toggle('review',rev);
 $('#qpos').textContent=(S.cur+1)+'/'+S.ids.length;
 $('#qid').textContent='(ID: '+id+')';
 $('#qdomain').textContent=DOMAINS[q.d];
 $('#qtext').innerHTML=esc(q.q).replace(/\n/g,'<br>');
 $('#qimg').innerHTML=q.img?`<div class="figure">${SVG[q.img]()}</div>`:'';
 $('#qinstr').textContent=instr(q);
 $('#markChk').checked=!!S.mark[id];
 const A=$('#answers');A.classList.toggle('locked',sol);A.innerHTML=body(q,a,sol,id);
 if(q.t==='hotspot'){A.querySelectorAll('.hs').forEach(g=>{const r=+g.dataset.r;if(a===r)g.classList.add('picked');if(sol){if(r===q.a)g.classList.add('right');else if(a===r)g.classList.add('wrongpick')}if(sol)g.setAttribute('tabindex','-1')})}
 $('#fb').innerHTML=feedback(q,a,sol,tr,rev,id);
 $('#note').hidden=true;
 $('#bPrev').disabled=S.cur===0;
 $('#bNext').disabled=rev&&S.cur===S.ids.length-1;
 $('#bHint').disabled=!tr||sol;
 $('#bReset').disabled=false;
 renderSegs();renderStat();save();
 $('#stage').scrollTop=0;
}
function body(q,a,sol,id){
 if(q.t==='single'||q.t==='multi'){
  const multi=q.t==='multi';
  return `<div class="opts${multi?' multi':''}" role="${multi?'group':'radiogroup'}">`+q.o.map((o,i)=>{
   const picked=multi?a.includes(i):a===i, right=multi?q.a.includes(i):q.a===i;
   let c='opt';if(picked)c+=' picked';let tag='';
   if(sol){if(right){c+=' right'+(picked?'':' missed');tag='<span class="tag">Đáp án đúng</span>'}else if(picked){c+=' wrong';tag='<span class="tag bad">Bạn chọn</span>'}}
   return `<button type="button" class="${c}" data-i="${i}" role="${multi?'checkbox':'radio'}" aria-checked="${picked}"${sol?' aria-disabled="true"':''}><span class="mk"></span><span>${esc(o)}</span>${tag}</button>`}).join('')+'</div>';
 }
 if(q.t==='yesno'){
  return `<div class="yn-wrap"><table class="yn"><thead><tr><th></th><th>Yes</th><th>No</th></tr></thead><tbody>`+q.rows.map((r,i)=>{
   const v=a[i],cor=q.a[i];
   const cell=val=>`<td data-r="${i}" data-v="${val}"${sol&&cor===val?' class="key"':''}><input type="radio" tabindex="-1" name="yn-${id}-${i}" ${v===val?'checked':''} ${sol?'disabled':''} aria-label="${val?'Yes':'No'}"></td>`;
   const verdict=sol?`<span class="verdict">${v===cor?'Đúng':'Sai, đáp án: '+(cor?'Yes':'No')}</span>`:'';
   return `<tr class="${sol?(v===cor?'right':'wrong'):''}"><td class="st">${esc(r)}${verdict}</td>${cell(1)}${cell(0)}</tr>`}).join('')+'</tbody></table></div>';
 }
 if(q.t==='match'){
  const placed=new Set(a.filter(v=>v!=null));
  const order=S.orders[id]||q.items.map((_,i)=>i);
  const chip=(i)=>`<div class="chip${selItem===i?' sel':''}" data-i="${i}" ${sol?'':'draggable="true" tabindex="0" role="button"'}>${esc(q.items[i])}${sol?'':MOVE}</div>`;
  const pool=order.filter(i=>!placed.has(i)).map(chip).join('');
  const rows=q.targets.map((t,k)=>{
   let c='slot';if(sol)c+=a[k]===q.a[k]?' ok':' bad';else if(selItem!=null)c+=' armed';
   const should=sol&&a[k]!==q.a[k]?`<div class="should">Đáp án: <b>${esc(q.items[q.a[k]])}</b></div>`:'';
   return `<div class="pair"><div class="${c}" data-slot="${k}" aria-label="Ô trả lời cho: ${esc(t)}">${a[k]!=null?chip(a[k]):''}${should}</div><div class="target">${esc(t)}</div></div>`}).join('');
  return `<div class="match"><div class="pool" aria-label="Các lựa chọn">${pool||'<div class="pool-empty">Đã dùng hết các mục</div>'}</div><div class="pairs">${rows}</div></div>`;
 }
 if(q.t==='hotspot')return `<div class="hsbox">${SVG[q.svg]()}</div>`;
 return '';
}
function feedback(q,a,sol,tr,rev,id){
 if(sol){
  const ok=isCorrect(q,a), was=answered(q,a);
  let key='';
  if(q.t==='single')key=esc(q.o[q.a]);
  else if(q.t==='multi')key=q.a.map(i=>esc(q.o[i])).join('; ');
  else if(q.t==='match')key=q.targets.map((t,k)=>`${esc(t.length>40?t.slice(0,38)+'…':t)} → <b>${esc(q.items[q.a[k]])}</b>`).join('<br>');
  return `<div class="fb-box"><div class="fb-head"><span class="pill ${ok?'ok':was?'bad':'warn'}">${ok?'Chính xác':was?'Chưa đúng':'Chưa trả lời'}</span><span>${DOMAINS[q.d]}</span></div>${key?`<p class="fb-key"><b>Đáp án đúng:</b><br>${key}</p>`:''}<p class="fb-exp"><b>Giải thích:</b> ${esc(q.e)}</p></div>`;
 }
 if(tr)return `<div class="fb-check"><button class="btn btn-end" id="bCheck" type="button" ${answered(q,a)?'':'disabled'}>Kiểm tra đáp án</button><span>hoặc bấm bóng đèn để xem đáp án</span></div>`;
 return '';
}
function renderSegs(){
 $('#segs').innerHTML=S.ids.map((id,i)=>{const q=QM[id],a=S.ans[id];let c='seg';
  if(S.done||(S.mode==='train'&&S.chk[id]))c+=isCorrect(q,a)?' ok':' bad';
  else if(S.mark[id])c+=' mk';else if(answered(q,a))c+=' ans';
  if(i===S.cur)c+=' cur';
  return `<button type="button" class="${c}" data-go="${i}" title="Câu ${i+1}" aria-label="Đến câu ${i+1}"></button>`}).join('');
}
function renderStat(){
 const n=S.ids.length;let txt;
 if(S.done)txt=`Đúng ${S.grade.c}/${n} · Điểm ${S.grade.score}/1000`;
 else if(S.mode==='train'){const ch=S.ids.filter(id=>S.chk[id]);txt=`Đã kiểm tra ${ch.length}/${n} · Đúng ${ch.filter(id=>isCorrect(QM[id],S.ans[id])).length}`}
 else{const k=S.ids.filter(id=>answered(QM[id],S.ans[id])).length,m=S.ids.filter(id=>S.mark[id]).length;txt=`Đã trả lời ${k}/${n}${m?` · Đánh dấu ${m}`:''}`}
 $('#stat').textContent=txt;
 $('#bSubmit').textContent=S.mode==='train'?'Kết thúc':'Nộp bài';
}
function setA(v){S.ans[curId()]=v;renderQ()}
function go(i){if(i<0||i>=S.ids.length)return;selItem=null;S.cur=i;renderQ()}
function place(item,slot){const a=S.ans[curId()].slice();const from=a.indexOf(item);const occ=a[slot];if(from>-1)a[from]=null;a[slot]=item;if(from>-1&&occ!=null&&from!==slot)a[from]=occ;setA(a)}
function unplace(item){const a=S.ans[curId()].slice();const k=a.indexOf(item);if(k>-1){a[k]=null;setA(a)}else renderQ()}

/* ---- sự kiện vùng trả lời ---- */
const AN=$('#answers');
AN.addEventListener('click',e=>{
 if(!S||locked())return;const q=QM[curId()];
 if(q.t==='single'||q.t==='multi'){const b=e.target.closest('.opt');if(!b)return;const i=+b.dataset.i;
  if(q.t==='single')return setA(i);
  let a=S.ans[curId()].slice();
  if(a.includes(i))a=a.filter(x=>x!==i);
  else{if(a.length>=q.a.length){note(`Câu này chỉ chọn ${q.a.length} đáp án. Bỏ chọn một đáp án trước khi chọn đáp án khác.`);return}a.push(i)}
  return setA(a.sort((x,y)=>x-y));
 }
 if(q.t==='yesno'){const td=e.target.closest('td[data-r]');if(!td)return;const a=S.ans[curId()].slice();a[+td.dataset.r]=+td.dataset.v;return setA(a)}
 if(q.t==='hotspot'){const g=e.target.closest('.hs');if(g)setA(+g.dataset.r);return}
 if(q.t==='match'){
  const chip=e.target.closest('.chip'),slot=e.target.closest('.slot');
  if(slot){const k=+slot.dataset.slot;if(selItem!=null){const i=selItem;selItem=null;return place(i,k)}if(chip)return unplace(+chip.dataset.i);return}
  if(chip){const i=+chip.dataset.i;selItem=selItem===i?null:i;return renderQ()}
  if(selItem!=null){selItem=null;renderQ()}
 }
});
AN.addEventListener('keydown',e=>{

AN.addEventListener('dragend',()=>AN.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')));
AN.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.slot,.pool');if(!z||locked())return;e.preventDefault();AN.querySelectorAll('.over').forEach(x=>{if(x!==z)x.classList.remove('over')});z.classList.add('over')});
AN.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.slot,.pool');if(!z||locked())return;e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(raw==='')return;const i=+raw;selItem=null;if(z.classList.contains('slot'))place(i,+z.dataset.slot);else unplace(i)});

$('#fb').addEventListener('click',e=>{if(e.target.closest('#bCheck')){S.chk[curId()]=true;renderQ()}});

  <div class="mfoot"><button type="button" class="btn btn-line" data-close>Đóng</button>${S.done?'':`<button type="button" class="btn btn-end" id="mToSubmit">${S.mode==='train'?'Kết thúc luyện tập':'Nộp bài'}</button>`}</div>`);
}

function grade(){
 const per=DOMAINS.map(()=>({n:0,c:0}));let c=0;
 const res=S.ids.map(id=>{const q=QM[id],ok=isCorrect(q,S.ans[id]);per[q.d].n++;if(ok){per[q.d].c++;c++}return ok});
 return {c,n:S.ids.length,per,res,score:Math.round(c/S.ids.length*1000),un:S.ids.filter(id=>!answered(QM[id],S.ans[id])).length};
}
function finish(){
 stopTimer();S.done=true;S.grade=grade();S.finished=Date.now();selItem=null;
 const g=S.grade,hist=store.get(K.hist,[]);
 hist.unshift({t:S.finished,m:S.mode,title:S.title||'',n:g.n,c:g.c,s:g.score,sec:S.elapsed});store.set(K.hist,hist.slice(0,40));
 const w=new Set(store.get(K.wrong,[]));
 S.ids.forEach((id,i)=>{if(g.res[i])w.delete(id);else if(S.mode==='test'||answered(QM[id],S.ans[id]))w.add(id)});
 store.set(K.wrong,[...w]);store.del(K.sess);showResult();
}

   <div class="card">
    <p class="eyebrow" style="margin:0">Training mode</p>
    <h2>Luyện tập</h2>
    <p>Kiểm tra đáp án ngay sau mỗi câu, có giải thích chi tiết. Không giới hạn thời gian.</p>
    <div class="chips">${DOMAINS.map((d,i)=>`<label class="cb"><input type="checkbox" id="dm${i}" checked> ${d} <span class="foot-note">(${cnt[i]})</span></label>`).join('')}</div>
    <div class="row"><label for="trCount">Số câu</label><select id="trCount"><option value="10">10</option><option value="20" selected>20</option><option value="45">45</option><option value="999">Tất cả</option></select><label><input type="checkbox" id="trShuf" checked> Xáo trộn thứ tự</label></div>
    <div class="actions"><button class="btn btn-end" id="hTrain" type="button">Bắt đầu luyện tập</button><button class="btn btn-line" id="hWrong" type="button" ${wrong.length?'':'disabled'}>Ôn ${wrong.length} câu từng làm sai</button></div>
   </div>
  </section>
  <section class="sec">
   <h2>Luyện theo lĩnh vực</h2>
   <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Lĩnh vực</th><th class="num">Số câu</th><th class="num">Đang sai</th><th></th></tr></thead><tbody>
   ${DOMAINS.map((d,i)=>`<tr><td>${d}</td><td class="num">${cnt[i]}</td><td class="num">${wrongBy[i]?`<span class="pill bad">${wrongBy[i]}</span>`:'0'}</td><td class="num"><button class="btn btn-line small-btn" data-dom="${i}" type="button">Luyện</button></td></tr>`).join('')}
   </tbody></table></div>
  </section>
  <section class="sec">
   <div class="sec-head"><h2>Lịch sử làm bài</h2>${hist.length?'<button class="btn btn-danger small-btn" id="hClear" type="button">Xóa lịch sử</button>':''}</div>
   <div class="tbl-wrap">${hist.length?`<table class="tbl"><thead><tr><th>Thời điểm</th><th>Chế độ</th><th class="num">Đúng</th><th class="num">Điểm</th><th class="num">Thời gian</th><th>Kết quả</th></tr></thead><tbody>
   ${hist.slice(0,15).map(h=>`<tr><td>${new Date(h.t).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}</td><td>${h.m==='test'?'Thi thử':'Luyện tập'}${h.title?' · '+esc(h.title):''}</td><td class="num">${h.c}/${h.n}</td><td class="num">${h.s}</td><td class="num">${fmt(h.sec)}</td><td><span class="pill ${h.s>=PASS?'ok':'bad'}">${h.s>=PASS?'Đạt':'Chưa đạt'}</span></td></tr>`).join('')}
   </tbody></table>`:'<div class="empty">Chưa có lượt làm bài nào. Kết quả mỗi lần thi thử hoặc luyện tập sẽ được lưu ở đây, trên trình duyệt này.</div>'}</div>
  </section>
  <p class="foot-note">Ngân hàng 100 câu được biên soạn theo 7 lĩnh vực của IC3 GS6 (Cơ bản về công nghệ, Công dân số, Quản lý thông tin, Tạo nội dung, Giao tiếp, Cộng tác, An toàn &amp; bảo mật) ở mức Level 2, với tình huống gần gũi học sinh. Đây là tài liệu tự luyện, không phải đề thi chính thức của Certiport/IIG. Tiến độ và lịch sử chỉ lưu trên trình duyệt của bạn. Phím tắt khi làm bài: ← / → để chuyển câu.</p>
 </div>`;
 $('#cand').oninput=e=>store.set(K.name,e.target.value.trim());
 $('#hTest').onclick=()=>newSession('test',pickTest(TEST_N),'');
 $('#hTrain').onclick=()=>{
  const ds=DOMAINS.map((_,i)=>$('#dm'+i).checked);
  let ids=BANK.filter(q=>ds[q.d]).map(q=>q.id);
  if($('#trShuf').checked)ids=shuffle(ids);
  ids=ids.slice(0,+$('#trCount').value);
  newSession('train',ids,ds.every(Boolean)?'':ds.filter(Boolean).length===1?DOMAINS[ds.indexOf(true)]:'Tùy chọn');
 };
 $('#hWrong').onclick=()=>newSession('train',shuffle(wrong),'Câu sai');
 $('#home').querySelectorAll('[data-dom]').forEach(b=>b.onclick=()=>{const d=+b.dataset.dom;newSession('train',shuffle(BANK.filter(q=>q.d===d).map(q=>q.id)),DOMAINS[d])});
 if($('#hResume'))$('#hResume').onclick=()=>{S=sess;selItem=null;openExam()};
 if($('#hDrop'))$('#hDrop').onclick=e=>armConfirm(e.currentTarget,()=>{store.del(K.sess);renderHome()});
 if($('#hClear'))$('#hClear').onclick=e=>armConfirm(e.currentTarget,()=>{store.del(K.hist);renderHome()});
}
function loadSession(){
 const s=store.get(K.sess,null);
 if(!s||!Array.isArray(s.ids)||s.done)return null;
 s.ids=s.ids.filter(id=>QM[id]&&s.ans&&id in s.ans);
 if(!s.ids.length)return null;
 s.cur=Math.min(s.cur||0,s.ids.length-1);s.mark=s.mark||{};s.skip=s.skip||{};s.chk=s.chk||{};s.orders=s.orders||{};
 return s;
}

/* ===================== PHÍM TẮT ===================== */
document.addEventListener('keydown',e=>{
 if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
 if($('#exam').hidden||!S)return;
 const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='select'||tag==='textarea')return;
 if(e.key==='ArrowRight'){e.preventDefault();$('#bNext').click()}
 else if(e.key==='ArrowLeft'){e.preventDefault();go(S.cur-1)}
});
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

renderHome();
</script>
